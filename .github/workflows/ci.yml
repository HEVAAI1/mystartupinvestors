name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # ponytail: advisory only — remaining highs are xlsx (no fix published) and
      # next's bundled postcss/sharp (fix requires next@16 major). Re-gate when fixable.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          DODO_PAYMENTS_API_KEY: placeholder
